<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자금집행</title>
<link rel="stylesheet" href="css/style.css?v=202609201335">
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("erpTheme") === "dark" ? "dark" : "light");</script>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <a class="app-brand" href="index.html"><span class="app-brand-text" data-i18n="moduleName">자금집행</span></a>

    <div class="app-nav-label" data-i18n="navSecMain">조회</div>
    <a class="app-nav-item" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="app-nav-text" data-i18n="navQuery">자금현황 조회</span>
    </a>
    <a class="app-nav-item" href="view.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><circle cx="17" cy="14.5" r="1.5"/></svg>
      <span class="app-nav-text" data-i18n="navCash">자금 현황</span>
    </a>

    <div class="app-nav-label" data-i18n="navSecAdmin">관리</div>
    <a class="app-nav-item active" href="admin.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 4.4-3.4 8.2-8 9-4.6-.8-8-4.6-8-9V7z"/></svg>
      <span class="app-nav-text" data-i18n="navAdminShort">관리자 화면</span>
    </a>

    <div class="app-sidebar-foot">
      <button class="app-theme-btn" id="themeToggle" aria-label="theme"></button>
      <button class="lang-btn" data-lang="ko">한</button>
      <button class="lang-btn" data-lang="zh">中</button>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <h1 data-i18n="appTitle">자금집행</h1>
      <nav class="nav-links">
        <a href="https://hyeongk215-boot.github.io/monthly-management-system/" data-i18n="navDashboard">← 통합 대시보드</a>
      </nav>
    </header>
    <main>
  <div class="card">
    <h2 data-i18n="adminHeading"></h2>
    <p class="desc" data-i18n="adminDesc"></p>
    <div class="form-grid">
      <div>
        <label data-i18n="adminKeyLabel"></label>
        <input type="password" id="adminKey">
      </div>
      <div>
        <label data-i18n="adminCorp"></label>
        <select id="adminCorp"></select>
      </div>
      <div>
        <label data-i18n="adminYm"></label>
        <select id="adminYm"></select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="fetchBtn" data-i18n="adminFetch"></button>
    </div>
    <div class="note-box" id="poolingBanner" style="display:none;" data-i18n="poolingBanner"></div>

    <h3 data-i18n="cashHeading" style="font-size:15px; margin-top:22px;"></h3>
    <div class="metric-cards">
      <div class="metric-card"><div class="label" data-i18n="beginningCny"></div><div class="value" id="beginningCny">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="cfNetChangeCny"></div><div class="value" id="cfNetChangeCny">-</div></div>
    </div>
    <div class="form-grid">
      <div>
        <label data-i18n="endingCny"></label>
        <input type="number" step="0.01" id="endingInput">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="saveCashBtn" data-i18n="cashSaveBtn"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="loansHeading" style="font-size:18px;"></h2>
    <div class="table-wrap">
      <table class="exp-table" id="loansTable">
        <thead>
          <tr>
            <th data-i18n="colPrincipal"></th>
            <th data-i18n="colBalance"></th>
            <th data-i18n="colInterestRate"></th>
            <th data-i18n="colStartDate"></th>
            <th data-i18n="colMaturityDate"></th>
            <th data-i18n="colNote"></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="loansBody"></tbody>
      </table>
    </div>
    <div class="btn-row">
      <button class="btn-secondary" id="addLoanBtn" data-i18n="loanAddBtn"></button>
    </div>
    <div class="card" id="loanForm" style="display:none; background:var(--surface-2); margin-top:14px;">
      <input type="hidden" id="loanId">
      <div class="form-grid">
        <div><label data-i18n="colPrincipal"></label><input type="number" step="0.01" id="loanPrincipal"></div>
        <div><label data-i18n="colBalance"></label><input type="number" step="0.01" id="loanBalance"></div>
        <div><label data-i18n="colInterestRate"></label><input type="number" step="0.01" id="loanRate"></div>
        <div><label data-i18n="colStartDate"></label><input type="date" id="loanStart"></div>
        <div><label data-i18n="colMaturityDate"></label><input type="date" id="loanMaturity"></div>
        <div><label data-i18n="colNote"></label><input type="text" id="loanNote"></div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="loanSaveBtn" data-i18n="loanSaveBtn"></button>
        <button class="btn-secondary" id="loanCancelBtn" data-i18n="loanCancelBtn"></button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="reconHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="reconDesc"></p>
    <div class="table-wrap">
      <table class="exp-table recon-table" id="reconTable">
        <thead>
          <tr>
            <th data-i18n="colCorp"></th>
            <th data-i18n="beginningCny"></th>
            <th data-i18n="colCfNet"></th>
            <th data-i18n="colComputedEnding"></th>
            <th data-i18n="colBsEnding"></th>
            <th data-i18n="colDiffIdentity"></th>
            <th data-i18n="colDiffOpening"></th>
            <th data-i18n="colDiffEnding"></th>
            <th data-i18n="colStatus"></th>
          </tr>
        </thead>
        <tbody id="reconBody"></tbody>
      </table>
    </div>
    <p class="desc" style="margin-top:12px; margin-bottom:0;" data-i18n="reconHint"></p>
  </div>

  <div class="card">
    <h2 data-i18n="dividendHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="dividendDesc"></p>
    <div class="form-grid">
      <div>
        <label data-i18n="dividendBase"></label>
        <select id="dividendBase"></select>
      </div>
    </div>
    <div class="metric-cards" style="margin-top:14px;">
      <div class="metric-card"><div class="label" data-i18n="dividendHeading"></div><div class="value" id="dividendValue">-</div></div>
    </div>
    <div class="note-box" id="dividendNote" style="display:none;"></div>
    <div class="table-wrap" style="margin-top:14px;">
      <table class="exp-table recon-table" id="dividendTable">
        <thead>
          <tr>
            <th data-i18n="colCorp"></th>
            <th data-i18n="dividendRetained"></th>
            <th data-i18n="dividendNetIncome"></th>
            <th data-i18n="dividendPlCum"></th>
            <th data-i18n="dividendHeading"></th>
            <th data-i18n="dividendSource"></th>
          </tr>
        </thead>
        <tbody id="dividendBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="aggHeading" style="font-size:18px;"></h2>
    <div class="table-wrap">
      <table class="exp-table" id="aggTable">
        <thead>
          <tr>
            <th>#</th>
            <th data-i18n="colCorp"></th>
            <th data-i18n="endingCny"></th>
            <th data-i18n="colBalance"></th>
            <th data-i18n="dividendHeading"></th>
          </tr>
        </thead>
        <tbody id="aggBody"></tbody>
      </table>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="downloadBtn" data-i18n="adminDownload"></button>
    </div>
  </div>
    </main>
    <footer>자금집행 · China Branch Fund Monitoring</footer>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="js/config.js?v=202609201335"></script>
<script src="vendor/supabase.js"></script>
<script src="js/i18n.js?v=202609201335"></script>
<script src="js/common.js?v=202609201335"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/app-admin.js?v=202609201335"></script>
</body>
</html>
